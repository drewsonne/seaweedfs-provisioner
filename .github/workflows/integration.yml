name: Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  seaweedfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SeaweedFS
        run: |
          docker run -d --name swfs -p 8333:8333 \
            -v "$PWD/tests/integration/s3.json:/etc/seaweedfs/s3.json" \
            chrislusf/seaweedfs:4.48 server -s3 \
            -s3.config=/etc/seaweedfs/s3.json -s3.iam.readOnly=false -dir=/data
          for _ in $(seq 1 60); do nc -z localhost 8333 && break; sleep 1; done
          sleep 5

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Integration tests
        env:
          SEAWEEDFS_IT: "1"
          SEAWEEDFS_ENDPOINT: localhost:8333
          SEAWEEDFS_ACCESS_KEY: admin-key
          SEAWEEDFS_SECRET_KEY: admin-secret
        run: uv run pytest tests/integration

      - name: SeaweedFS logs
        if: failure()
        run: docker logs swfs
