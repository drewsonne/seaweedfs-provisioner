[project]
name = "seaweedfs-provisioner"
version = "0.0.0"
description = "Kubernetes operator to provision SeaweedFS buckets and users via CRDs"
requires-python = ">=3.14"
dependencies = [
    "kopf>=1.37,<2",
    "boto3>=1.35",
    "kubernetes>=31,<33",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.11",
    "ty>=0.0.1a7",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN204",  # missing return type for __init__
    "COM812",  # trailing comma (formatter handles)
    "CPY001",  # no copyright header needed
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"controller/**/*.py" = [
    "ANN401",   # kopf passes Any for body/spec/status
    "ARG001",   # kopf handlers have required unused params
    "D103",     # kopf handlers don't need docstrings
    "EM102",    # f-string in TemporaryError is fine for kopf
    "INP001",   # controller/ is not a package
    "PLC0415",  # imports inside handlers to avoid circular deps
    "PLR0913",  # kopf handlers have many params by design
    "PLR0917",  # ditto, positional
    "PLR2004",  # magic values in status code checks
    "TRY003",   # long messages in TemporaryError are fine for kopf
]
"tests/**/*.py" = [
    "D103",     # test names describe the behaviour
    "INP001",   # tests/ is not a package
    "S101",     # pytest uses assert
    "SLF001",   # tests exercise private helpers
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["controller"]
markers = ["integration: needs a real SeaweedFS (set SEAWEEDFS_IT=1)"]

[tool.ty.environment]
extra-paths = ["controller"]
